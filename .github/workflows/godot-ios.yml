name: Godot iOS build

on:
  push:
    branches: [godot4]
  pull_request:
    branches: [godot4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Godot 4 project validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Import project and check scripts
        run: godot --headless --editor --path godot --quit

  ios-export:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    needs: validate
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Ensure iOS export template is installed
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -s "$TEMPLATE_DIR/ios.zip" ]; then
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot_export_templates.tpz"
            unzip -l "$RUNNER_TEMP/godot_export_templates.tpz" | grep -q 'templates/ios.zip'
            unzip -p "$RUNNER_TEMP/godot_export_templates.tpz" templates/ios.zip > "$TEMPLATE_DIR/ios.zip"
          fi
          test -s "$TEMPLATE_DIR/ios.zip"
          echo "Verified iOS export template: $TEMPLATE_DIR/ios.zip"
      - name: Configure unsigned iOS export
        run: |
          set -euo pipefail
          # A 10-character placeholder is used only to generate an unsigned Xcode project.
          sed -i '' 's/application\/app_store_team_id=""/application\/app_store_team_id="ABCDE12XYZ"/' godot/export_presets.cfg
      - name: Export iOS Xcode project
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ios"
          godot --headless --verbose --path godot --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/SheriffAmericanLife"
          echo "Godot Xcode project export output:"
          find "$GITHUB_WORKSPACE/build/ios" -maxdepth 4 -print
          if ! find "$GITHUB_WORKSPACE/build/ios" -maxdepth 4 -name "*.xcodeproj" -print -quit | grep -q .; then
            echo "::error::Godot did not export an Xcode project into build/ios."
            exit 1
          fi
      - name: Build app without Apple signing
        run: |
          set -euo pipefail
          PROJECT="$(find build/ios -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::Godot export did not contain an Xcode project."
            find build/ios -maxdepth 3 -print
            exit 1
          fi
          DERIVED="$PWD/build/ios/DerivedData"
          xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::Xcode completed without producing an .app bundle."
            exit 1
          fi
          mkdir -p build/ios/package/Payload
          cp -R "$APP" build/ios/package/Payload/
          (cd build/ios/package && /usr/bin/zip -qry "$PWD/../SheriffAmericanLife-unsigned.ipa" Payload)
          test -s build/ios/SheriffAmericanLife-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: sheriff-american-life-unsigned-ipa
          path: build/ios/SheriffAmericanLife-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
