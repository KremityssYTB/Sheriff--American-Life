<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>SHERIFF: AMERICAN LIFE — Ocala Preview</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101820;color:#f3f5f6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#101820}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#7d9865}
#hud{position:fixed;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);pointer-events:none}
.panel{pointer-events:auto;background:#101820dd;border:1px solid #ffffff22;border-radius:12px;padding:9px 11px;box-shadow:0 4px 18px #0005}
#top{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
#brand{font-weight:800;letter-spacing:.08em;font-size:12px}#status{font-size:11px;color:#b9c8d0;margin-top:3px}
#topActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid #ffffff25;border-radius:10px;background:#243642;color:#fff;font-weight:700;padding:10px 12px;font-size:12px;min-height:40px;touch-action:none}
button:active,.held{background:#416477;border-color:#8ac4dc}
#mission{position:absolute;left:10px;top:84px;max-width:min(280px,70vw);font-size:12px;line-height:1.35}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80vw;text-align:center;font-weight:700;font-size:14px;opacity:0;transition:opacity .15s}
#controls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
#pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:48px 48px 48px;gap:4px}
#pad button{padding:0;font-size:18px;background:#142630dc}
#pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
#actions{display:grid;grid-template-columns:repeat(2,minmax(68px,1fr));gap:6px;max-width:190px}
#actions button{min-width:68px}
#vehicleControls{display:none;grid-template-columns:repeat(2,minmax(68px,1fr));gap:6px;max-width:190px}
#vehicleControls button{min-width:68px}
#mapTag{position:absolute;right:10px;top:84px;font-size:10px;color:#d8e3dc;text-align:right;text-shadow:0 1px 4px #000}
#hint{font-size:10px;color:#b8c8d0;margin-top:5px}
@media(min-width:800px){#controls{max-width:850px;left:50%;transform:translateX(-50%)}#pad{grid-template-columns:60px 60px 60px;grid-template-rows:54px 54px 54px}#mission{max-width:320px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="top">
  <div class="panel"><div id="brand">SHERIFF: AMERICAN LIFE</div><div id="status">MARION COUNTY • OCALA TEST DISTRICT</div></div>
  <div id="topActions">
   <button id="duty">GO OFF DUTY</button><button id="camera">MAP</button><button id="call">911 CALL</button>
  </div>
 </div>
 <div id="mission" class="panel">PATROL STATUS<br><strong id="missionText">Start near the Marion County Sheriff Office.</strong><div id="hint">Walk to the SUV and tap ENTER. Explore the town and interact with locations.</div></div>
 <div id="mapTag">OCALA • MARION COUNTY<br>EARLY BROWSER PREVIEW</div>
 <div id="toast"></div>
 <div id="controls">
  <div id="pad">
   <button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button>
  </div>
  <div id="actions">
   <button id="enter">ENTER</button><button id="interact">INTERACT</button><button id="sprint">SPRINT</button><button id="lights">LIGHTS OFF</button>
  </div>
  <div id="vehicleControls">
   <button data-drive="left">◀ TURN</button><button data-drive="right">TURN ▶</button><button data-drive="gas">GAS</button><button data-drive="brake">BRAKE</button>
  </div>
 </div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={status:document.getElementById('status'),mission:document.getElementById('missionText'),hint:document.getElementById('hint'),duty:document.getElementById('duty'),enter:document.getElementById('enter'),interact:document.getElementById('interact'),sprint:document.getElementById('sprint'),lights:document.getElementById('lights'),vehicle:document.getElementById('vehicleControls'),actions:document.getElementById('actions'),call:document.getElementById('call'),toast:document.getElementById('toast')};
let W=0,H=0,dpr=1,last=0,toastTimer=0;
const world={w:2600,h:1900};
const player={x:1180,y:970,a:-Math.PI/2,speed:0};
const suv={x:1225,y:980,a:-Math.PI/2,speed:0};
let inCar=false,onDuty=true,lights=false,sprinting=false,mission=null,camZoom=1,interactText='INTERACT';
const held={up:false,down:false,left:false,right:false,gas:false,brake:false,turnL:false,turnR:false};
const roads=[
{x:0,y:920,w:2600,h:130},{x:1210,y:0,w:140,h:1900},
{x:280,y:430,w:1900,h:82},{x:350,y:1380,w:1850,h:82},
{x:420,y:200,w:80,h:1500},{x:2040,y:170,w:80,h:1500},
{x:780,y:220,w:72,h:1500},{x:1660,y:220,w:72,h:1500}
];
const places=[
{name:'MARION COUNTY SHERIFF OFFICE',type:'sheriff',x:1020,y:1120,w:170,h:105,color:'#c9d1d2'},
{name:'DOWNTOWN OCALA',type:'downtown',x:1250,y:720,w:260,h:120,color:'#c2a77d'},
{name:'OCALA MARKET',type:'store',x:1450,y:1080,w:120,h:90,color:'#d6bd7c'},
{name:'SUNSHINE GAS',type:'gas',x:820,y:1110,w:130,h:90,color:'#c8ad64'},
{name:'MARION COUNTY COURTHOUSE',type:'civic',x:1370,y:580,w:130,h:105,color:'#c6c5bd'},
{name:'RESIDENTIAL HOMES',type:'home',x:520,y:720,w:220,h:130,color:'#b7a18c'},
{name:'OCALA AUTO SERVICE',type:'shop',x:1800,y:1100,w:150,h:90,color:'#a8b2b5'},
{name:'FORT KING DISTRICT',type:'park',x:2200,y:450,w:240,h:230,color:'#5c8651'},
{name:'RURAL HORSE FARM',type:'farm',x:2220,y:1510,w:260,h:190,color:'#719456'}
];
const traffic=[];
for(let i=0;i<9;i++)traffic.push({x:150+i*280,y:i%2?885:955,a:i%2?0:Math.PI,s:35+(i%4)*7,c:['#d7d9dc','#9babb5','#6f7c85','#b4a28c'][i%4]});
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function say(t){ui.toast.textContent=t;ui.toast.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.style.opacity=0,1800)}
function pos(){return inCar?suv:player}
function nearPlace(){let p=pos(),best=null,dist=1e9;for(const l of places){let d=Math.hypot(p.x-l.x,p.y-l.y);if(d<dist){dist=d;best=l}}return dist<145?best:null}
function interact(){let l=nearPlace();if(!l){say('Nothing nearby to interact with.');return}
 if(l.type==='gas'){if(inCar){say('Fuel topped up.');}else say('Walk up to the pump or bring a vehicle.');}
 else if(l.type==='store'){say(onDuty?'Store open. Grab supplies before your shift.':'Purchased snacks and supplies.');}
 else if(l.type==='home'){say('Home interaction point. Rest and change clothes coming next.');}
 else if(l.type==='sheriff'){say('Sheriff Office: duty staging area.');}
 else if(l.type==='civic'){say('Courthouse district. Public services and records planned.');}
 else if(l.type==='shop'){say('Auto service: vehicle repairs coming next.');}
 else if(l.type==='park'){say('Fort King recreation and historic district.');}
 else if(l.type==='farm'){say('Rural Marion County horse farm.');}
 else say('Downtown Ocala. Explore the shops and streets.');}
function toggleCar(){if(!inCar){if(Math.hypot(player.x-suv.x,player.y-suv.y)>100){say('Move closer to the patrol SUV.');return}inCar=true;player.x=suv.x;player.y=suv.y;ui.enter.textContent='EXIT';ui.actions.style.display='none';ui.vehicle.style.display='grid';say('Entered patrol SUV.');}
 else{inCar=false;player.x=suv.x-58*Math.cos(suv.a+Math.PI/2);player.y=suv.y-58*Math.sin(suv.a+Math.PI/2);ui.enter.textContent='ENTER';ui.actions.style.display='grid';ui.vehicle.style.display='none';suv.speed=0;say('Exited patrol SUV.');}}
function toggleDuty(){onDuty=!onDuty;ui.duty.textContent=onDuty?'GO OFF DUTY':'GO ON DUTY';ui.status.textContent='MARION COUNTY • '+(onDuty?'ON DUTY':'OFF DUTY');say(onDuty?'You are now on duty.':'You are now off duty.');}
function call911(){if(!onDuty){say('Go on duty to receive dispatch calls.');return}const choices=[{x:1500,y:770,t:'Disturbance reported downtown'},{x:800,y:1260,t:'Traffic collision near Sunshine Gas'},{x:2020,y:1080,t:'Suspicious activity near auto service'},{x:2180,y:1450,t:'Medical call in rural Marion County'}];const c=choices[Math.floor(Math.random()*choices.length)];mission={...c};ui.mission.textContent=c.t+'. Respond and tap INTERACT at the scene.';say('Dispatch: '+c.t);}
function completeCall(){if(!mission){interact();return}let p=pos();if(Math.hypot(p.x-mission.x,p.y-mission.y)<170){mission=null;ui.mission.textContent='Call cleared. Resume patrol or go off duty.';say('Dispatch: call cleared. Good work.');}else say('You are not at the call location yet.');}
function drawRoads(){ctx.fillStyle='#789562';ctx.fillRect(0,0,world.w,world.h);
 // wooded patches
 for(let i=0;i<75;i++){let x=(i*317)%world.w,y=(i*193)%world.h;ctx.fillStyle=i%3?'#6f8b59':'#829b67';ctx.beginPath();ctx.arc(x,y,18+(i%5)*5,0,Math.PI*2);ctx.fill()}
 for(const r of roads){ctx.fillStyle='#424b4d';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#b8b7a6';if(r.h>r.w){ctx.fillRect(r.x+5,r.y,4,r.h);ctx.fillRect(r.x+r.w-9,r.y,4,r.h)}else{ctx.fillRect(r.x,r.y+5,r.w,4);ctx.fillRect(r.x,r.y+r.h-9,r.w,4)}ctx.strokeStyle='#e2d6a1';ctx.lineWidth=3;ctx.setLineDash([25,22]);ctx.beginPath();if(r.h>r.w){ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h)}else{ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2)}ctx.stroke();ctx.setLineDash([])}
 // water
 ctx.fillStyle='#4d8f9b';ctx.beginPath();ctx.moveTo(0,1540);ctx.quadraticCurveTo(380,1450,520,1650);ctx.quadraticCurveTo(710,1830,940,1900);ctx.lineTo(0,1900);ctx.fill();
}
function drawPlaces(){for(const l of places){ctx.fillStyle=l.color;ctx.fillRect(l.x-l.w/2,l.y-l.h/2,l.w,l.h);ctx.strokeStyle='#253238';ctx.lineWidth=5;ctx.strokeRect(l.x-l.w/2,l.y-l.h/2,l.w,l.h);ctx.fillStyle='#f3f2e9';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(l.name,l.x,l.y+l.h/2+24);if(l.type==='sheriff'){ctx.fillStyle='#1c3443';ctx.fillRect(l.x-18,l.y-12,36,24);ctx.fillStyle='#e8edf0';ctx.font='bold 13px system-ui';ctx.fillText('★',l.x,l.y+5)}}}
function drawCar(v,police=false){ctx.save();ctx.translate(v.x,v.y);ctx.rotate(v.a);ctx.fillStyle='#0005';ctx.fillRect(-22,-11,50,28);ctx.fillStyle=police?'#e6e9eb':v.c;ctx.fillRect(-25,-13,50,26);ctx.fillStyle=police?'#162e40':'#394b52';ctx.fillRect(-7,-11,18,22);ctx.fillStyle='#9ec4d1';ctx.fillRect(-5,-10,13,20);if(police){ctx.fillStyle='#1e3c57';ctx.fillRect(-25,-13,16,26);ctx.fillStyle=lights?'#ef4e4e':'#263b4d';ctx.fillRect(-6,-15,12,4);ctx.fillStyle=lights?'#3e9dff':'#263b4d';ctx.fillRect(7,-15,12,4)}ctx.restore()}
function drawPlayer(){if(inCar)return;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.a);ctx.fillStyle='#101820';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e2c8a2';ctx.beginPath();ctx.arc(0,-3,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e6edf0';ctx.fillRect(-7,6,14,11);ctx.restore()}
function draw(){const p=pos();const scale=Math.min(W/920,H/620)*camZoom;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2-p.x*scale,H/2-p.y*scale);ctx.scale(scale,scale);drawRoads();drawPlaces();for(const t of traffic)drawCar(t);drawCar(suv,true);drawPlayer();if(mission){ctx.strokeStyle='#ffdd65';ctx.lineWidth=5;ctx.beginPath();ctx.arc(mission.x,mission.y,35+Math.sin(performance.now()/180)*7,0,Math.PI*2);ctx.stroke()}ctx.restore();
 // small compass / speed
 ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='right';ctx.fillText(inCar?Math.round(Math.abs(suv.speed)*2.2)+' MPH':'ON FOOT',W-14,H-24);
}
function update(dt){const p=pos();if(inCar){let gas=(held.gas?1:0)-(held.brake?1:0);suv.speed+=(gas*150-suv.speed*(gas?0:2.8))*dt;suv.speed=Math.max(-65,Math.min(155,suv.speed));let turn=(held.turnR?1:0)-(held.turnL?1:0);suv.a+=turn*1.7*Math.sign(suv.speed)*Math.min(1,Math.abs(suv.speed)/35)*dt;suv.x+=Math.cos(suv.a)*suv.speed*dt;suv.y+=Math.sin(suv.a)*suv.speed*dt;suv.x=Math.max(35,Math.min(world.w-35,suv.x));suv.y=Math.max(35,Math.min(world.h-35,suv.y));player.x=suv.x;player.y=suv.y;}
 else{let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0),m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;let sp=sprinting?240:150;player.x+=dx*sp*dt;player.y+=dy*sp*dt;if(dx||dy)player.a=Math.atan2(dy,dx);player.x=Math.max(25,Math.min(world.w-25,player.x));player.y=Math.max(25,Math.min(world.h-25,player.y));}
 for(const t of traffic){t.x+=Math.cos(t.a)*t.s*dt;if(t.x>world.w+50)t.x=-50;if(t.x< -50)t.x=world.w+50;}
 const l=nearPlace();ui.interact.textContent=mission?'CLEAR CALL':(l?l.type==='store'?'SHOP':l.type==='gas'?'REFUEL':'INTERACT':'INTERACT');ui.enter.textContent=inCar?'EXIT':(Math.hypot(player.x-suv.x,player.y-suv.y)<100?'ENTER':'NEAR SUV');}
function loop(ts){let dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function bindHold(el,key){el.addEventListener('pointerdown',e=>{e.preventDefault();held[key]=true;el.classList.add('held');el.setPointerCapture(e.pointerId)});const off=e=>{held[key]=false;el.classList.remove('held')};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}
document.querySelectorAll('[data-move]').forEach(b=>bindHold(b,b.dataset.move));
document.querySelectorAll('[data-drive]').forEach(b=>bindHold(b,({left:'turnL',right:'turnR',gas:'gas',brake:'brake'})[b.dataset.drive]));
ui.enter.onclick=toggleCar;ui.interact.onclick=completeCall;document.getElementById('carInteract').onclick=completeCall;ui.duty.onclick=toggleDuty;ui.call.onclick=call911;ui.lights.onclick=()=>{lights=!lights;ui.lights.textContent=lights?'LIGHTS ON':'LIGHTS OFF';say(lights?'Emergency lights enabled.':'Emergency lights disabled.');};ui.sprint.onpointerdown=e=>{sprinting=true;ui.sprint.setPointerCapture(e.pointerId)};ui.sprint.onpointerup=()=>sprinting=false;ui.sprint.onpointercancel=()=>sprinting=false;document.getElementById('camera').onclick=()=>{camZoom=camZoom===1?1.35:1;say(camZoom>1?'Zoomed map view.':'Normal view.');};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')held.up=true;if(k==='s'||k==='arrowdown')held.down=true;if(k==='a'||k==='arrowleft')held.left=true;if(k==='d'||k==='arrowright')held.right=true;if(k==='e')toggleCar();if(k==='f')completeCall();if(k==='shift')sprinting=true;if(k===' ')held.gas=true;if(k==='q')held.turnL=true;if(k==='r')held.turnR=true;});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')held.up=false;if(k==='s'||k==='arrowdown')held.down=false;if(k==='a'||k==='arrowleft')held.left=false;if(k==='d'||k==='arrowright')held.right=false;if(k==='shift')sprinting=false;if(k===' ')held.gas=false;if(k==='q')held.turnL=false;if(k==='r')held.turnR=false;});
say('Ocala preview loaded. Explore the district.');
})();
</script>
</body>
</html>
